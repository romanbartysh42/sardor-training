window.storage = {
  async get(key) { try { const v = localStorage.getItem(key); return v === null ? null : { key: key, value: v }; } catch (e) { return null; } },
  async set(key, value) { try { localStorage.setItem(key, String(value)); return { key: key, value: String(value) }; } catch (e) { return null; } },
  async delete(key) { try { localStorage.removeItem(key); return { key: key, deleted: true }; } catch (e) { return null; } },
  async list(prefix) { try { const keys = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (!prefix || (k && k.indexOf(prefix) === 0)) keys.push(k); } return { keys: keys, prefix: prefix }; } catch (e) { return null; } }
};

  { id: "q46", cat: "Бренд и тон", q: "Менеджер пишет от имени Сардора. Главное следствие для общения?", opts: ["Можно писать формально — это всё-таки компания", "Клиент думает, что говорит лично с Сардором; тон — живой, как в его Reels", "Нужно уточнить, что вы менеджер, а не Сардор", "Можно обещать смелее — отвечает ведь Сардор"], correct: 1, why: "Для клиента ты и есть Сардор, которому он поверил в ролике. Отсюда живой тон — и аккуратность в обещаниях, а не формальность." },
  { id: "q47", cat: "Бренд и тон", q: "Клиент после консультации вежливо отказался. Что должно остаться у него в ощущении?", opts: ["Лёгкое сожаление, что упустил выгоду", "Что ему помогли и о нём позаботились — даже без покупки", "Безразличие: не купил и не купил", "Что менеджер зря потратил на него время"], correct: 1, why: "Стандарт бренда — забота даже без покупки. Не «он упустил выгоду», а «ему помогли»: такой человек вернётся и порекомендует." },

function ExamBody() {
  const K = 18;
  const PASS = 85;
  const [phase, setPhase] = useState("intro");
  const [quiz, setQuiz] = useState([]);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [stats, setStats] = useState({ best: null, attempts: 0 });
  const [name, setName] = useState("");
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const b = await window.storage.get("exam:best");
        const a = await window.storage.get("exam:attempts");
        const nm = await window.storage.get("exam:name");
        if (alive) {
          setStats({
            best: b && b.value ? JSON.parse(b.value) : null,
            attempts: a && a.value ? JSON.parse(a.value) : 0,
          });
          if (nm && nm.value) setName(nm.value);
        }
      } catch (e) {}
    })();
    return () => { alive = false; };
  }, []);

  const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  const startExam = async () => {
    // Check attempt limit
    const hasAttempt = await checkAttemptApi();
    if (hasAttempt) { setPhase("blocked"); return; }
    // Записываем флаг старта в localStorage — чтобы перезагрузка не давала новую попытку
    const startKey = 'exam_started_' + (currentUser ? currentUser.id : '') + '_' + new Date().toISOString().slice(0,10);
    localStorage.setItem(startKey, '1');
    try { await window.storage.set("exam:name", name.trim()); } catch (e) {}
    let seen = [];
    try {
      const s = await window.storage.get("exam:seen");
      if (s && s.value) seen = JSON.parse(s.value);
    } catch (e) {}
    const unseen = EXAM_BANK.filter((q) => !seen.includes(q.id));
    const pool = unseen.length >= K ? unseen : EXAM_BANK;
    const chosen = shuffle(pool).slice(0, K).map((q) => {
      const tagged = q.opts.map((text, i) => ({ text, ok: i === q.correct }));
      const sh = shuffle(tagged);
      return { id: q.id, cat: q.cat, q: q.q, why: q.why, shOpts: sh, correctIdx: sh.findIndex((o) => o.ok) };
    });
    setQuiz(chosen);
    setIdx(0); setPicked(null); setAnswers([]); setPhase("quiz");
  };

  const pick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    setAnswers((prev) => [...prev, { ok: i === quiz[idx].correctIdx, cat: quiz[idx].cat }]);
  };

  const next = async () => {
    if (idx + 1 < quiz.length) { setIdx(idx + 1); setPicked(null); return; }
    const correct = answers.filter((a) => a.ok).length;
    const pct = Math.round((correct / quiz.length) * 100);
    await saveResultApi(pct, correct, quiz.length);
    try {
      let seen = [];
      const s = await window.storage.get("exam:seen");
      if (s && s.value) seen = JSON.parse(s.value);
      let newSeen = Array.from(new Set([...seen, ...quiz.map((q) => q.id)]));
      if (newSeen.length >= EXAM_BANK.length) newSeen = quiz.map((q) => q.id);
      await window.storage.set("exam:seen", JSON.stringify(newSeen));
      const best = Math.max(stats.best || 0, pct);
      const attempts = (stats.attempts || 0) + 1;
      await window.storage.set("exam:best", JSON.stringify(best));
      await window.storage.set("exam:attempts", JSON.stringify(attempts));
      setStats({ best, attempts });
    } catch (e) {}
    setPhase("result");
  };

  if (phase === "blocked") {
    return (
      <div>
        <Card accent="rgba(240,140,125,0.3)" fill="rgba(240,140,125,0.08)">
          <div style={{ fontSize: 30, textAlign: "center", marginBottom: 8 }}>🔒</div>
          <div style={{ fontSize: 18, fontWeight: 800, textAlign: "center", color: C.red, marginBottom: 8 }}>Попытка уже использована</div>
          <div style={{ fontSize: 13.5, lineHeight: 1.55, color: C.sub, textAlign: "center" }}>
            Ты уже сдавал экзамен сегодня. Следующая попытка — завтра.
          </div>
        </Card>
        <Card fill="rgba(255,255,255,0.02)">
          <div style={{ fontSize: 13, color: C.sub, lineHeight: 1.55 }}>
            Используй это время чтобы повторить материал — перечитай разделы которые вызвали затруднения.
          </div>
        </Card>
      </div>
    );
  }

  if (phase === "intro") {
    return (
      <div>
        <Card accent="rgba(91,141,239,0.3)" fill="linear-gradient(135deg,rgba(62,111,217,0.16),rgba(91,200,196,0.12))">
          <div style={{ fontSize: 30, textAlign: "center", marginBottom: 6 }}>🎯</div>
          <div style={{ fontSize: 15, lineHeight: 1.55, color: C.ink, textAlign: "center" }}>
            Финальный экзамен — твой допуск к работе с живыми клиентами.
          </div>
        </Card>
        <Card>
          <div style={{ fontSize: 13.5, lineHeight: 1.55, color: C.sub }}>
            {K} вопросов по реальным рабочим ситуациям из всех разделов. Варианты ответов похожи и сделаны так, чтобы наугад не пройти — нужно действительно знать материал. После каждого ответа — объяснение. Проходной балл — {PASS}%, и вопросы каждый раз разные.
          </div>
        </Card>
        {stats.attempts > 0 && (
          <Card fill="rgba(255,255,255,0.02)">
            <div style={{ fontSize: 12.5, color: C.sub }}>
              Попыток пройдено: <b style={{ color: C.ink }}>{stats.attempts}</b>
              {stats.best != null ? <span> · лучший результат: <b style={{ color: stats.best >= PASS ? C.green : C.gold }}>{stats.best}%</b></span> : null}
            </div>
          </Card>
        )}
        <Card fill="rgba(255,255,255,0.02)">
          <div style={{ fontSize: 12, fontWeight: 800, color: C.faint, letterSpacing: 0.3, marginBottom: 6 }}>МЕНЕДЖЕР</div>
          <div style={{ fontSize: 15, fontWeight: 700, color: C.ink }}>{currentUser ? currentUser.name : name}</div>
        </Card>
        <button onClick={startExam} style={{ width: "100%", padding: 15, borderRadius: 15, border: "none", cursor: "pointer", fontSize: 15, fontWeight: 800, color: "#08111f", background: "linear-gradient(135deg,#E9B872,#E0A85C)", marginTop: 4 }}>
          Начать экзамен →
        </button>
      </div>
    );
  }

  if (phase === "quiz") {
    const cq = quiz[idx];
    const answered = picked !== null;
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ fontSize: 12, fontWeight: 800, color: C.faint }}>ВОПРОС {idx + 1} / {quiz.length}</span>
          <Pill color={C.blue} bg="rgba(91,141,239,0.14)">{cq.cat}</Pill>
        </div>
        <div style={{ height: 4, background: "rgba(255,255,255,0.07)", borderRadius: 4, marginBottom: 14 }}>
          <div style={{ height: 4, width: `${(idx / quiz.length) * 100}%`, background: C.gold, borderRadius: 4, transition: "width 0.3s" }} />
        </div>
        <Card>
          <div style={{ fontSize: 14.5, lineHeight: 1.5, color: C.ink }}>{cq.q}</div>
        </Card>
        {cq.shOpts.map((o, i) => {
          const isCorrect = i === cq.correctIdx;
          const isPicked = i === picked;
          let bg = "rgba(255,255,255,0.04)", border = C.cardBorder;
          if (answered && isCorrect) { bg = "rgba(91,217,154,0.14)"; border = "rgba(91,217,154,0.5)"; }
          else if (answered && isPicked && !isCorrect) { bg = "rgba(240,140,125,0.14)"; border = "rgba(240,140,125,0.5)"; }
          return (
            <button key={i} onClick={() => pick(i)} disabled={answered}
              style={{ display: "block", width: "100%", textAlign: "left", marginBottom: 8, padding: "12px 14px", borderRadius: 12, border: `1px solid ${border}`, background: bg, color: C.ink, fontSize: 13.5, lineHeight: 1.4, cursor: answered ? "default" : "pointer" }}>
              {answered && isCorrect ? "✅ " : answered && isPicked && !isCorrect ? "❌ " : ""}{o.text}
            </button>
          );
        })}
        {answered && (
          <div>
            <Card accent="rgba(233,184,114,0.3)" fill={C.goldSoft}>
              <div style={{ fontSize: 11, fontWeight: 800, color: C.gold, marginBottom: 4 }}>ПОЧЕМУ ТАК</div>
              <div style={{ fontSize: 13, lineHeight: 1.5, color: C.ink }}>{cq.why}</div>
            </Card>
            <button onClick={next} style={{ width: "100%", padding: 14, borderRadius: 14, border: "none", cursor: "pointer", fontSize: 15, fontWeight: 800, color: "#08111f", background: "linear-gradient(135deg,#E9B872,#E0A85C)" }}>
              {idx + 1 < quiz.length ? "Дальше →" : "Узнать результат →"}
            </button>
          </div>
        )}
      </div>
    );
  }

  const correct = answers.filter((a) => a.ok).length;
  const pct = Math.round((correct / quiz.length) * 100);
  const passed = pct >= PASS;
  const cats = {};
  answers.forEach((a) => {
    if (!cats[a.cat]) cats[a.cat] = { ok: 0, total: 0 };
    cats[a.cat].total += 1; if (a.ok) cats[a.cat].ok += 1;
  });
  const resultText = "Академия продаж · " + (name || "Без имени") + ": " + correct + "/" + quiz.length + " (" + pct + "%) — " + (passed ? "СДАЛ ✅" : "не сдал ❌");
  const sendResult = async () => {
    try { if (navigator.share) { await navigator.share({ text: resultText }); return; } } catch (e) {}
    try { await navigator.clipboard.writeText(resultText); setCopied(true); setTimeout(() => setCopied(false), 2500); return; } catch (e) {}
    try { window.prompt("Скопируй результат и отправь руководителю:", resultText); } catch (e) {}
  };
  const copyResult = async () => {
    try { await navigator.clipboard.writeText(resultText); setCopied(true); setTimeout(() => setCopied(false), 2500); } catch (e) { try { window.prompt("Скопируй результат:", resultText); } catch (e2) {} }
  };
  return (
    <div>
      <Card accent={passed ? "rgba(91,217,154,0.4)" : "rgba(240,140,125,0.4)"} fill={passed ? "rgba(91,217,154,0.1)" : "rgba(240,140,125,0.1)"}>
        <div style={{ fontSize: 34, textAlign: "center", marginBottom: 4 }}>{passed ? "🎉" : "📚"}</div>
        <div style={{ fontSize: 22, fontWeight: 800, textAlign: "center", color: passed ? C.green : C.red, marginBottom: 4 }}>{correct} / {quiz.length} · {pct}%</div>
        <div style={{ fontSize: 14, lineHeight: 1.5, textAlign: "center", color: C.ink }}>
          {passed ? "Допуск к работе с клиентами ✅ Поздравляю — ты готов." : `Пока рано. Нужно ${PASS}% и выше. Перечитай слабые разделы и попробуй снова — вопросы будут другими.`}
        </div>
      </Card>
      <div style={{ fontSize: 13, fontWeight: 800, color: C.faint, letterSpacing: 0.5, margin: "16px 4px 10px" }}>РЕЗУЛЬТАТ ПО РАЗДЕЛАМ</div>
      {Object.keys(cats).map((c, i) => {
        const r = cats[c];
        const col = r.ok === r.total ? C.green : r.ok === 0 ? C.red : C.gold;
        return (
          <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "9px 12px", marginBottom: 6, background: "rgba(255,255,255,0.03)", borderRadius: 10 }}>
            <span style={{ fontSize: 13, color: C.ink }}>{c}</span>
            <span style={{ fontSize: 13, fontWeight: 800, color: col }}>{r.ok}/{r.total}</span>
          </div>
        );
      })}
      <div style={{ fontSize: 13, fontWeight: 800, color: C.faint, letterSpacing: 0.5, margin: "18px 4px 10px" }}>ОТПРАВИТЬ РЕЗУЛЬТАТ</div>
      <Card fill="rgba(91,141,239,0.08)" accent="rgba(91,141,239,0.3)">
        <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.5, color: C.ink, marginBottom: 10 }}>{name || "Без имени"}: {correct}/{quiz.length} ({pct}%) — {passed ? "СДАЛ" : "не сдал"}</div>
        <button onClick={sendResult} style={{ width: "100%", padding: 13, borderRadius: 12, border: "none", cursor: "pointer", fontSize: 14, fontWeight: 800, color: "#08111f", background: "linear-gradient(135deg,#5BC8C4,#5B8DEF)" }}>
          📤 Отправить руководителю
        </button>
        <button onClick={copyResult} style={{ width: "100%", padding: 11, borderRadius: 12, border: "1px solid " + C.cardBorder, cursor: "pointer", fontSize: 13, fontWeight: 700, color: C.sub, background: "transparent", marginTop: 8 }}>
          {copied ? "Скопировано ✓" : "Скопировать текст"}
        </button>
      </Card>
      <button onClick={startExam} style={{ width: "100%", padding: 15, borderRadius: 15, border: "none", cursor: "pointer", fontSize: 15, fontWeight: 800, color: "#08111f", background: "linear-gradient(135deg,#E9B872,#E0A85C)", marginTop: 10 }}>
        Пройти заново →
      </button>
    </div>
  );
}

// ── Узел пути на главном экране ─────────────────────────────────────────────
function PathNode({ section, state, onOpen, last }) {
  const locked = state === "locked";
  const done = state === "done";
  const dot = done ? C.green : locked ? "rgba(255,255,255,0.12)" : C.gold;
  return (
    <div style={{ display: "flex", gap: 14, opacity: locked ? 0.5 : 1 }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
        <div style={{ width: 38, height: 38, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center",
          background: done ? "rgba(91,217,154,0.16)" : locked ? "rgba(255,255,255,0.04)" : C.goldSoft,
          border: `1.5px solid ${dot}`, fontSize: 17 }}>
          {done ? "✓" : locked ? "🔒" : section.icon}
        </div>
        {!last && <div style={{ width: 2, flex: 1, minHeight: 26, background: "rgba(255,255,255,0.1)", marginTop: 4, marginBottom: 4 }} />}
      </div>
      <div style={{ flex: 1, paddingBottom: 18 }}>
        <button disabled={locked} onClick={onOpen}
          style={{ width: "100%", textAlign: "left", background: C.card, border: `1px solid ${done ? "rgba(91,217,154,0.3)" : locked ? C.cardBorder : "rgba(233,184,114,0.3)"}`,
            borderRadius: 16, padding: 14, cursor: locked ? "default" : "pointer" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: C.faint, letterSpacing: 0.4 }}>РАЗДЕЛ {section.num}</div>
            {section.status === "draft" && !section.isExam && <Pill color={C.gold} bg={C.goldSoft}>черновик</Pill>}
            {section.isExam && <Pill color={C.blue} bg="rgba(91,141,239,0.14)">экзамен</Pill>}
            {section.status === "ready" && <Pill color={C.green} bg="rgba(91,217,154,0.14)">готов</Pill>}
          </div>
          <div style={{ fontSize: 15.5, fontWeight: 800, color: locked ? C.sub : C.ink, marginTop: 3 }}>{section.title}</div>

}

// ── Главный экран ───────────────────────────────────────────────────────────
function Home({ completed, onOpen }) {
  const total = COURSE.length;
  const doneCount = completed.length;
  const pct = Math.round((doneCount / total) * 100);
  // индекс первого незавершённого = текущий открытый шаг
  const firstOpen = COURSE.findIndex((s) => !completed.includes(s.id));

  const stateOf = (i) => {
    const s = COURSE[i];
    if (completed.includes(s.id)) return "done";
    // открыт, если это первый раздел или предыдущий завершён
    if (i === 0 || completed.includes(COURSE[i - 1].id)) return "open";
    return "locked";
  };

  return (
    <div style={{ padding: "0 0 40px" }}>
      <div style={{ padding: "26px 18px 18px", background: "linear-gradient(160deg, rgba(91,141,239,0.14), rgba(11,17,32,0) 70%)" }}>
        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.4, color: C.gold }}>SARDOR TRAVEL</div>
        <div style={{ fontSize: 26, fontWeight: 900, color: C.ink, marginTop: 4, lineHeight: 1.1, letterSpacing: -0.5 }}>Академия продаж</div>
        <div style={{ fontSize: 13.5, color: C.sub, marginTop: 6, lineHeight: 1.45 }}>
          Путь нового менеджера от нуля до допуска к клиентам. Проходи по порядку — каждый раздел открывает следующий.
        </div>

        <div style={{ marginTop: 18, background: C.card, border: `1px solid ${C.cardBorder}`, borderRadius: 16, padding: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>Твой прогресс</span>
            <span style={{ fontSize: 13, fontWeight: 800, color: C.gold }}>{doneCount} из {total}</span>
          </div>
          <div style={{ height: 8, borderRadius: 100, background: "rgba(255,255,255,0.08)", marginTop: 10, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${pct}%`, borderRadius: 100, background: "linear-gradient(90deg,#E9B872,#5BC8C4)", transition: "width .4s" }} />
          </div>
        </div>
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        {COURSE.map((s, i) => (
          <PathNode key={s.id} section={s} state={stateOf(i)} last={i === COURSE.length - 1}
            onOpen={() => onOpen(i)} />
        ))}
      </div>
    </div>
  );
}

// GOOGLE API — авторизация и результаты

function getApiUrl() {
  return localStorage.getItem('sardor_api_url') || '';
}

let currentUser = null;

// ─── AUTH SCREEN COMPONENT ────────────────────
function AuthScreen({ onLogin }) {
  const [login, setLogin] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [showSettings, setShowSettings] = React.useState(false);
  const [apiUrl, setApiUrl] = React.useState(localStorage.getItem('sardor_api_url') || '');
  const [settingsStatus, setSettingsStatus] = React.useState('');

  const doLogin = async () => {
    if (!login || !password) { setError('Введи логин и пароль'); return; }
    const url = getApiUrl();
    if (!url) { setError('Сначала настрой подключение — нажми ⚙️ Настройки'); return; }
    setLoading(true); setError('');
    try {
      const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'login', login, password }) });
      const data = await res.json();
      setLoading(false);
      if (data.success) { currentUser = data.user; onLogin(data.user); }
      else { setError(data.error || 'Неверный логин или пароль'); }
    } catch(e) { setLoading(false); setError('Ошибка соединения. Проверь интернет.'); }
  };

  const saveUrl = () => {
    if (!apiUrl || !apiUrl.startsWith('https://')) { setSettingsStatus('❌ Введи правильный URL'); return; }
    localStorage.setItem('sardor_api_url', apiUrl);
    setSettingsStatus('✅ URL сохранён!');
  };

  const testUrl = async () => {
    if (!apiUrl) { setSettingsStatus('❌ Сначала введи URL'); return; }
    setSettingsStatus('⏳ Проверяем...');
    try {
      const res = await fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: 'login', login: 'test', password: 'test' }) });
      await res.json();
      setSettingsStatus('✅ Соединение работает!');
    } catch(e) { setSettingsStatus('❌ Не удалось подключиться'); }
  };

  return (
    <div style={{ minHeight: '100vh', background: 'radial-gradient(120% 80% at 50% 0%, #0E1A2E, #0B1120)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 20, fontFamily: "'Manrope', system-ui, sans-serif" }}>
      <div style={{ width: '100%', maxWidth: 380 }}>
        <div style={{ textAlign: 'center', marginBottom: 32 }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>🎯</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: '#E9B872' }}>Sardor Travel</div>
          <div style={{ fontSize: 13, color: '#8B97A8', marginTop: 4 }}>Академия продаж</div>
        </div>
        <div style={{ background: 'rgba(255,255,255,0.05)', borderRadius: 16, padding: 24, border: '1px solid rgba(255,255,255,0.08)' }}>
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: '#8B97A8', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 6 }}>Логин</div>
            <input value={login} onChange={e => setLogin(e.target.value)} placeholder="Введи логин" style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid rgba(255,255,255,0.12)', background: 'rgba(255,255,255,0.05)', color: '#E8EDF5', fontSize: 14, outline: 'none' }} />
          </div>
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: '#8B97A8', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 6 }}>Пароль</div>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Введи пароль" onKeyDown={e => e.key === 'Enter' && doLogin()} style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid rgba(255,255,255,0.12)', background: 'rgba(255,255,255,0.05)', color: '#E8EDF5', fontSize: 14, outline: 'none' }} />
          </div>
          <button onClick={doLogin} style={{ width: '100%', padding: 14, borderRadius: 12, border: 'none', cursor: 'pointer', fontSize: 15, fontWeight: 800, color: '#08111f', background: 'linear-gradient(135deg,#E9B872,#E0A85C)' }}>
            {loading ? 'Проверяем...' : 'Войти →'}
          </button>
          {error && <div style={{ marginTop: 12, padding: '10px 14px', borderRadius: 8, background: 'rgba(240,100,80,0.15)', border: '1px solid rgba(240,100,80,0.3)', color: '#F06450', fontSize: 13, textAlign: 'center' }}>{error}</div>}
          {loading && <div style={{ marginTop: 10, textAlign: 'center', fontSize: 13, color: '#8B97A8' }}>Проверяем...</div>}
        </div>
        <div style={{ textAlign: 'center', marginTop: 12 }}>
          <button onClick={() => setShowSettings(!showSettings)} style={{ background: 'none', border: 'none', color: '#8B97A8', fontSize: 12, cursor: 'pointer', opacity: 0.6 }}>⚙️ Настройки</button>
        </div>
        {showSettings && (
          <div style={{ marginTop: 8, background: 'rgba(255,255,255,0.04)', borderRadius: 12, padding: 16, border: '1px solid rgba(255,255,255,0.06)' }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#E8EDF5', marginBottom: 8 }}>⚙️ Настройки подключения</div>
            <div style={{ fontSize: 11.5, color: '#8B97A8', marginBottom: 10, lineHeight: 1.5 }}>Вставь URL из Google Apps Script. Один раз — сохранится навсегда.</div>
            <textarea value={apiUrl} onChange={e => setApiUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" style={{ width: '100%', padding: 10, borderRadius: 8, border: '1px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.04)', color: '#E8EDF5', fontSize: 11, height: 60, resize: 'none', outline: 'none', fontFamily: 'monospace' }} />
            <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
              <button onClick={saveUrl} style={{ flex: 1, padding: 9, borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 700, color: '#08111f', background: '#E9B872' }}>Сохранить</button>
              <button onClick={testUrl} style={{ flex: 1, padding: 9, borderRadius: 8, border: '1px solid rgba(91,217,154,0.4)', cursor: 'pointer', fontSize: 12, fontWeight: 700, color: '#5BD99A', background: 'rgba(91,217,154,0.08)' }}>Проверить</button>
            </div>
            {settingsStatus && <div style={{ marginTop: 8, fontSize: 12, color: settingsStatus.includes('✅') ? '#5BD99A' : settingsStatus.includes('⏳') ? '#8B97A8' : '#F06450' }}>{settingsStatus}</div>}
          </div>
        )}
      </div>
    </div>
  );
}

async function checkAttemptApi() {
  // First check localStorage flag (handles page refresh during exam)
  const today = new Date().toISOString().slice(0,10);
  const startKey = 'exam_started_' + (currentUser ? currentUser.id : '') + '_' + today;
  if (localStorage.getItem(startKey)) return true;
  // Then check server
  const url = getApiUrl();
  if (!url || !currentUser) return false;
  try {
    const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'checkAttempt', program: 'style', userId: currentUser.id }) });
    const data = await res.json();
    return data.hasAttempt || false;
  } catch(e) { return false; }
}

async function saveResultApi(score, correct, total, started) {
  const url = getApiUrl();
  if (!url || !currentUser) return;
  try {
    await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'saveResult', program: 'style', userId: currentUser.id, userName: currentUser.name, score, correct, total, started: started || false }) });
  } catch(e) {}
}

function App() {
  const [completed, setCompleted] = useState([]);
  const [openIdx, setOpenIdx] = useState(null); // null = home
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("progress");
        if (r && r.value) setCompleted(JSON.parse(r.value));
      } catch (e) { /* нет сохранёнки — первый запуск */ }
      setLoaded(true);
    })();
  }, []);

  const save = async (next) => {
    setCompleted(next);
    try { await window.storage.set("progress", JSON.stringify(next)); } catch (e) {}
  };

  const complete = (id) => {
    if (!completed.includes(id)) save([...completed, id]);
    setOpenIdx(null);
  };

  const canOpen = (i) => i === 0 || completed.includes(COURSE[i - 1].id) || completed.includes(COURSE[i].id);

  const [authed, setAuthed] = React.useState(false);
  const [user, setUser] = React.useState(null);

  if (!authed) return <AuthScreen onLogin={(u) => { setUser(u); setAuthed(true); }} />;

  return (
    <div style={{ minHeight: "100vh", background: `radial-gradient(120% 80% at 50% 0%, ${C.bg2}, ${C.bg})`, fontFamily: "'Manrope', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0; }
        button:active { transform: scale(0.99); }
      `}</style>

      <div style={{ maxWidth: 460, margin: "0 auto", minHeight: "100vh", position: "relative" }}>
        {!loaded ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", color: C.sub, fontSize: 14 }}>
            Загрузка…
          </div>
        ) : openIdx === null ? (
          <Home completed={completed} onOpen={(i) => canOpen(i) && setOpenIdx(i)} />
        ) : (
          <SectionScreen
            section={COURSE[openIdx]}
            isDone={completed.includes(COURSE[openIdx].id)}
            onBack={() => setOpenIdx(null)}
            onComplete={() => complete(COURSE[openIdx].id)}
          />
        )}
      </div>
    </div>
  );
}


const __container = document.getElementById("root");
if (ReactDOM && ReactDOM.createRoot) { ReactDOM.createRoot(__container).render(<App />); } else { ReactDOM.render(<App />, __container); }

</script>
</body>
</html>
